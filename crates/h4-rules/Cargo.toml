[package]
name = "h4-rules"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Game rules of Heroes of Might and Magic IV, without graphics"

[dependencies]
# the game's tables (creature stats) and maps as read from the files; the rules
# themselves don't open files
h4-formats = { path = "../h4-formats" }
# the game state the rules build and change
h4-state = { path = "../h4-state" }
